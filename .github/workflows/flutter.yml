name: Eazy Monorepo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flutter-analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  flutter-android-release-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter create --platforms=android --org com.eazy .
      - name: Configure Google Services and Android desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          settings = Path("android/settings.gradle.kts")
          s = settings.read_text()
          marker = 'id("org.jetbrains.kotlin.android") version "'
          if 'id("com.google.gms.google-services") version' not in s:
              anchor = s.index(marker)
              line_end = s.index("\n", anchor)
              s = s[:line_end + 1] + '    id("com.google.gms.google-services") version "4.4.2" apply false\n' + s[line_end + 1:]
          settings.write_text(s)
          app = Path("android/app/build.gradle.kts")
          a = app.read_text()
          if 'id("com.google.gms.google-services")' not in a:
              a = a.replace('id("dev.flutter.flutter-gradle-plugin")', 'id("dev.flutter.flutter-gradle-plugin")\n    id("com.google.gms.google-services")', 1)
          compile = 'isCoreLibraryDesugaringEnabled = true'
          if compile not in a:
              a = a.replace("compileOptions {", "compileOptions {\n        " + compile, 1)
          if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")' not in a:
              a += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n'
          app.write_text(a)
          PY
      - run: flutter build apk --release --no-tree-shake-icons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace(
              "compileOptions {",
              "compileOptions {\n        isCoreLibraryDesugaringEnabled = true",
              1,
          )
          s += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n'
          p.write_text(s)
          PY
      - run: flutter build apk --release --no-tree-shake-icons

  backend-build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
