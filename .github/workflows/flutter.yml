name: Eazy Monorepo CI

concurrency:
  group: eazy-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ios-config-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate iOS Firebase, Google Sign-In, Apple Sign-In, and permissions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          firebase_path = Path("ios/Runner/GoogleService-Info.plist")
          info_path = Path("ios/Runner/Info.plist")
          entitlements_path = Path("ios/Runner/Runner.entitlements")
          project_path = Path("ios/Runner.xcodeproj/project.pbxproj")
          podfile_path = Path("ios/Podfile")
          for path in (firebase_path, info_path, entitlements_path, project_path, podfile_path):
              if not path.is_file():
                  raise SystemExit(f"Missing required iOS configuration: {path}")

          def read_plist(path):
              with path.open("rb") as handle:
                  return plistlib.load(handle)

          firebase = read_plist(firebase_path)
          info = read_plist(info_path)
          entitlements = read_plist(entitlements_path)
          if firebase.get("PROJECT_ID") != "eazy-24e6a":
              raise SystemExit("Firebase iOS project ID mismatch")
          if firebase.get("BUNDLE_ID") != "com.eazy.app":
              raise SystemExit("Firebase iOS bundle ID mismatch")
          if info.get("GIDClientID") != firebase.get("CLIENT_ID"):
              raise SystemExit("Google Sign-In client ID in Info.plist does not match Firebase iOS config")
          if firebase.get("REVERSED_CLIENT_ID") not in [
              scheme for entry in info.get("CFBundleURLTypes", [])
              for scheme in entry.get("CFBundleURLSchemes", [])
          ]:
              raise SystemExit("Google Sign-In reversed client ID URL scheme is missing")
          for key in ("NSCameraUsageDescription", "NSLocationWhenInUseUsageDescription", "NSPhotoLibraryUsageDescription"):
              if not info.get(key):
                  raise SystemExit(f"Missing iOS permission description: {key}")
          if "Default" not in entitlements.get("com.apple.developer.applesignin", []):
              raise SystemExit("Sign in with Apple entitlement is missing")
          project = project_path.read_text()
          if "GoogleService-Info.plist in Resources" not in project:
              raise SystemExit("Firebase plist is not included in the Runner Resources build phase")
          if project.count("CODE_SIGN_ENTITLEMENTS = Runner/Runner.entitlements;") != 3:
              raise SystemExit("Apple sign-in entitlement must be applied to Debug, Profile, and Release Runner builds")
          podfile = podfile_path.read_text()
          if "platform :ios, '15.0'" not in podfile or "flutter_install_all_ios_pods" not in podfile:
              raise SystemExit("Flutter CocoaPods setup is incomplete")
          print("iOS configuration preflight passed.")
          PY
  flutter-ios-simulator-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --simulator --no-codesign --dart-define=GOOGLE_SERVER_CLIENT_ID=370546190167-dqltoqcnuvkkrh163qk80sdm8ejfm3ta.apps.googleusercontent.com
      - name: Package iOS simulator app for smoke testing
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app build/ios/Runner-simulator.zip
      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: eazy-ios-simulator-${{ github.sha }}
          path: build/ios/Runner-simulator.zip
          if-no-files-found: error
          retention-days: 7

  android-signed-release:
    runs-on: ubuntu-latest
    needs:
      - flutter-analyze-test
      - backend-build-test
      - flutter-android-debug-smoke
      - flutter-ios-simulator-smoke
      - ios-config-preflight
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v4
      - run: flutter pub get
      - name: Check release signing secrets
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_STORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signed release skipped. Configure the four Android signing secrets to enable it."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
      - name: Write private signing files
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set +x
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/eazy-release.keystore
          chmod 600 android/app/eazy-release.keystore
          umask 077
          cat > android/key.properties <<EOF
          storeFile=eazy-release.keystore
          storePassword=$ANDROID_STORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
      - name: Build signed Android App Bundle
        if: steps.signing.outputs.configured == 'true'
        run: flutter build appbundle --release --dart-define=GOOGLE_SERVER_CLIENT_ID=370546190167-dqltoqcnuvkkrh163qk80sdm8ejfm3ta.apps.googleusercontent.com
      - name: Build signed Android release APK
        if: steps.signing.outputs.configured == 'true'
        run: flutter build apk --release --dart-define=GOOGLE_SERVER_CLIENT_ID=370546190167-dqltoqcnuvkkrh163qk80sdm8ejfm3ta.apps.googleusercontent.com
      - name: Verify signed Android outputs
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        run: |
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose build/app/outputs/flutter-apk/app-release.apk
      - name: Upload signed Android release artifacts
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eazy-signed-release-${{ github.sha }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

  flutter-analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  flutter-android-debug-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v4
      - run: flutter pub get
      - run: flutter build apk --debug --no-tree-shake-icons --dart-define=GOOGLE_SERVER_CLIENT_ID=370546190167-dqltoqcnuvkkrh163qk80sdm8ejfm3ta.apps.googleusercontent.com
      - name: Upload Android debug APK for device smoke testing
        uses: actions/upload-artifact@v4
        with:
          name: eazy-debug-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  backend-build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm audit fix --ignore-scripts
      - run: npm ci
      - name: Report backend dependency vulnerabilities
        shell: bash
        run: |
          npm audit --json > /tmp/eazy-npm-audit.json || true
          node --input-type=module -e "import fs from 'node:fs'; const audit = JSON.parse(fs.readFileSync('/tmp/eazy-npm-audit.json', 'utf8')); for (const [name, item] of Object.entries(audit.vulnerabilities ?? {})) console.log(JSON.stringify({name, severity:item.severity, direct:item.isDirect, range:item.range, fixAvailable:item.fixAvailable, via:item.via.map(v => typeof v === 'string' ? v : {title:v.title, url:v.url, range:v.range})}));"
      - run: npm run build
      - run: npm test
      - name: Upload refreshed backend lockfile
        uses: actions/upload-artifact@v4
        with:
          name: eazy-backend-package-lock-${{ github.sha }}
          path: backend/package-lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce clean dependency audit
        run: npm audit --audit-level=moderate
