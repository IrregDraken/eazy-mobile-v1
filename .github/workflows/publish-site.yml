name: Validate Eazy public website

on:
  push:
    branches: [eazy/public-site]
    paths:
      - "public-site/**"
      - ".github/workflows/publish-site.yml"
      - "railway.json"
  pull_request:
    branches: [main]
    paths:
      - "public-site/**"
      - ".github/workflows/publish-site.yml"
      - "railway.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate source, routes, and contact details
        shell: bash
        run: |
          set -euo pipefail
          node --check public-site/site.js
          node --check public-site/server.js
          node -e "const p=require('./public-site/package.json'); if (!p.scripts || p.scripts.start !== 'node server.js') process.exit(1)"
          test -s public-site/index.html
          test -s public-site/site.css
          test -s public-site/site.js
          test -s public-site/server.js
          test -s public-site/Dockerfile
          grep -q 'public-site/Dockerfile' railway.json
          grep -q '"startCommand": "npm start"' railway.json
          for route in privacy terms cookies support delete-account community-guidelines payments-refunds security; do
            test -s "public-site/$route/index.html"
            grep -q 'id="app"' "public-site/$route/index.html"
          done
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path("public-site")
          js = (root / "site.js").read_text()
          required = [
              "support@eazy.name.ng", "privacy@eazy.name.ng",
              "legal@eazy.name.ng",
              "Thony Dynamic Enterprises", "RC 2962026",
          ]
          for item in required:
              if item not in js:
                  raise SystemExit(f"Missing required public-site content: {item}")
          ET.parse(root / "sitemap.xml")
          print("Public website source validation passed.")
          PY
      - name: Smoke-test rendered policy routes
        shell: bash
        run: |
          set -euo pipefail
          PORT=38765 node public-site/server.js > /tmp/eazy-public-site.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:38765/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:38765/health | grep -q '"status":"ok"'
          while IFS='|' read -r route expected; do
            [ -n "$route" ] || continue
            response="$(curl --fail --silent "http://127.0.0.1:38765$route")"
            printf '%s' "$response" | grep -Fq "$expected"
            printf 'PASS %s\n' "$route"
          done <<'ROUTES'
          /|Your world,
          /privacy/|Your data. Your choices.
          /terms/|The rules for using Eazy.
          /cookies/|Cookies and similar technologies.
          /support/|How can we help?
          /delete-account/|Delete your Eazy account.
          /community-guidelines/|Help keep Eazy safe.
          /payments-refunds/|Understand a payment before you repeat it.
          /security/|Report a security concern.
          ROUTES
