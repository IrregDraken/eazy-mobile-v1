name: eazy_mobile_v1
description: Eazy, rebuilt in Flutter with a fresh visual system and production architecture.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.1
  flutter_secure_storage: ^9.2.4
  http: ^1.5.0
  intl: ^0.20.2
  go_router: ^16.2.4
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  crypto: ^3.0.6
  image_picker: ^1.2.0
  mobile_scanner: ^7.0.0
  qr_flutter: ^4.1.0
  geolocator: ^14.0.2
  url_launcher: ^6.3.2
  firebase_messaging: ^16.0.0
  flutter_local_notifications: ^19.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/eazy_logo_mark.png
    - assets/images/eazy_app_icon.png
    - assets/images/eazy_auth_hero.png
    - assets/images/categories/
